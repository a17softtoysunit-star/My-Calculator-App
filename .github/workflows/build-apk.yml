name: Build My Calculator APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Pillow & Run Icon Generator
        run: |
          pip install pillow
          python scripts/generate_icons.py

      - name: Install Cordova CLI
        run: |
          npm install -g cordova

      - name: Add Android Platform
        run: |
          cordova platform add android@13.0.0 --save

      - name: Build Android Debug APK
        run: |
          cordova build android --debug

      - name: Prepare APK Output
        run: |
          mkdir -p output
          APK_PATH=$(find platforms/android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -f "$APK_PATH" ]; then
            cp "$APK_PATH" output/MyCalculator-v1.0.0.apk
          else
            echo "APK not found!" && exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyCalculator-APK
          path: output/MyCalculator-v1.0.0.apk
          retention-days: 14
          
